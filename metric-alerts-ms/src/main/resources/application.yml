spring:
  application:
    name: metric-alerts-ms
  config:
    import: optional:configserver:http://localhost:8888/
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 0
metrics:
  enabled: true
  cpu:
    kafka:
      bootstrap-servers: http://localhost:9092
      topic: "cpu-metrics"
    interval: 60000
  ram:
    kafka:
      bootstrap-servers: http://localhost:9092
      topic: "ram-metrics"
    interval: 60000