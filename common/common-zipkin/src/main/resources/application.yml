spring:
  application:
    name: "common-zipkin"

management:
  tracing:
    enabled: true
    sampling:
      probability: 1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  otlp:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  opentelemetry:
    tracer:
      exporter:
        zipkin:
          endpoint: http://localhost:9411/api/v2/spans
